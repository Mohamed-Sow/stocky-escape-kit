services:
  - type: web
    name: stocky-escape-kit
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_APP_HANDLE
        value: stocky-escape-kit
      - key: SCOPES
        value: read_products,read_inventory,read_locations
      - key: SHOPIFY_BILLING_TEST
        value: "false"
      - key: SHOPIFY_SYNC_VARIANT_LIMIT
        value: "5000"
      - key: SHOPIFY_PARTNER_ORG_ID
        sync: false
      - key: SHOPIFY_PARTNER_API_TOKEN
        sync: false
      - key: SHOPIFY_PARTNER_APP_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stocky-escape-kit-db
          property: connectionString

databases:
  - name: stocky-escape-kit-db
    databaseName: stocky_escape_kit
    user: stocky_escape_kit
    plan: basic-1gb
    region: ohio
    ipAllowList: []
